[project]
name = "ai-bankrun-radar"
version = "0.1.0"
description = "Low-cost framework for early detection of behavioral correlation spikes as AI agents enter financial markets"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "networkx>=3.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "httpx>=0.25.0",
    "openai>=1.0.0",
    "aiosqlite>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "plotly>=5.15.0",
]

[project.scripts]
radar = "contagion_radar.cli.app:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
